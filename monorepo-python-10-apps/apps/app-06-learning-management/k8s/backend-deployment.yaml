apiVersion: apps/v1
kind: Deployment
metadata: { name: app-06-backend, namespace: monorepo-apps }
spec:
  replicas: 1
  selector: { matchLabels: { app: app-06-backend } }
  template:
    metadata: { labels: { app: app-06-backend } }
    spec:
      containers:
        - name: backend
          image: app-06-backend:latest
          ports: [{ containerPort: 8000 }]
          livenessProbe: { httpGet: { path: /health, port: 8000 } }
          readinessProbe: { httpGet: { path: /health, port: 8000 } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
