apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: app-07-backend-hpa, namespace: monorepo-apps }
spec: { scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: app-07-backend }, minReplicas: 1, maxReplicas: 3, metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }] }
