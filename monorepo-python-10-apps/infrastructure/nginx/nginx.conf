events {}
http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    location = /app-01 { return 301 /app-01/; }
    location /app-01/ { proxy_pass http://app-01-frontend:5173/; }
    location /api/app-01/ { proxy_pass http://app-01-backend:8000/; }
    location = /app-02 { return 301 /app-02/; }
    location /app-02/ { proxy_pass http://app-02-frontend:5173/; }
    location /api/app-02/ { proxy_pass http://app-02-backend:8000/; }
    location = /app-03 { return 301 /app-03/; }
    location /app-03/ { proxy_pass http://app-03-frontend:5173/; }
    location /api/app-03/ { proxy_pass http://app-03-backend:8000/; }
    location = /app-04 { return 301 /app-04/; }
    location /app-04/ { proxy_pass http://app-04-frontend:5173/; }
    location /api/app-04/ { proxy_pass http://app-04-backend:8000/; }
    location = /app-05 { return 301 /app-05/; }
    location /app-05/ { proxy_pass http://app-05-frontend:5173/; }
    location /api/app-05/ { proxy_pass http://app-05-backend:8000/; }
    location = /app-06 { return 301 /app-06/; }
    location /app-06/ { proxy_pass http://app-06-frontend:5173/; }
    location /api/app-06/ { proxy_pass http://app-06-backend:8000/; }
    location = /app-07 { return 301 /app-07/; }
    location /app-07/ { proxy_pass http://app-07-frontend:5173/; }
    location /api/app-07/ { proxy_pass http://app-07-backend:8000/; }
    location = /app-08 { return 301 /app-08/; }
    location /app-08/ { proxy_pass http://app-08-frontend:5173/; }
    location /api/app-08/ { proxy_pass http://app-08-backend:8000/; }
    location = /app-09 { return 301 /app-09/; }
    location /app-09/ { proxy_pass http://app-09-frontend:5173/; }
    location /api/app-09/ { proxy_pass http://app-09-backend:8000/; }
    location = /app-10 { return 301 /app-10/; }
    location /app-10/ { proxy_pass http://app-10-frontend:5173/; }
    location /api/app-10/ { proxy_pass http://app-10-backend:8000/; }
    location / {
      return 200 'monorepo-python-10-apps';
      add_header Content-Type text/plain;
    }
  }
}
